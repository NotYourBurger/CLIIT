[project]
name = "cliit"
version = "0.1.0"
description = "CLIIT is a Markdown-native issue tracker for developers and coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cliit", "issue-tracker", "markdown", "git", "cli", "ai-agents"]
authors = [
    { name = "Tahmid Khan Alim", email = "tahmidkhanofficial@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
    "tzlocal>=5.4.4",
]

[project.urls]
Homepage = "https://github.com/NotYourBurger/CLIIT"
Repository = "https://github.com/NotYourBurger/CLIIT"
Issues = "https://github.com/NotYourBurger/CLIIT/issues"
Changelog = "https://github.com/NotYourBurger/CLIIT/blob/main/CHANGELOG.md"

[project.scripts]
issue = "cli_issue_tracker.cli:app"
cliit = "cli_issue_tracker.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cli_issue_tracker"
source-include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "docs/**",
    "tests/**",
]
